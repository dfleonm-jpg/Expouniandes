<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Sereno</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #eef1f6;
      background:
        radial-gradient(1000px 600px at 50% -10%, rgba(59,111,229,.18), transparent 60%),
        radial-gradient(800px 500px at 100% 110%, rgba(56,189,248,.12), transparent 60%),
        #060910;
      padding: 24px; text-align: center;
    }
    .card {
      max-width: 420px;
      background: rgba(18,18,28,.6);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px; padding: 40px 28px;
      backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 20px 60px -20px rgba(0,0,0,.6);
    }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #3b6fe5, #38bdf8);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 40px -8px rgba(59,111,229,.6);
    }
    .logo svg { width: 40px; height: 40px; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
    p { color: #8b94a7; line-height: 1.6; font-size: .95rem; }
    .btn {
      display: inline-block; margin-top: 24px;
      background: linear-gradient(135deg, #3b6fe5, #5b8def);
      color: #fff; font-weight: 600; text-decoration: none;
      padding: 12px 28px; border-radius: 999px; border: 0; cursor: pointer;
      font-size: .95rem;
    }
    .dot { color: #34d399; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5a3 3 0 0 0-5.5 1.5A2.5 2.5 0 0 0 4 9a2.5 2.5 0 0 0 1 4 2.5 2.5 0 0 0 2.5 3M12 5v14M12 5a3 3 0 0 1 5.5 1.5A2.5 2.5 0 0 1 20 9a2.5 2.5 0 0 1-1 4 2.5 2.5 0 0 1-2.5 3"/>
      </svg>
    </div>
    <h1>Estás sin conexión</h1>
    <p>Sereno necesita internet para hablar con la IA. Tu progreso guardado sigue a salvo <span class="dot">●</span> y vuelve en cuanto recuperes la conexión.</p>
    <button class="btn" onclick="location.reload()">Reintentar</button>
  </div>
  <script>
    // Reintenta automáticamente cuando vuelve la conexión.
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
